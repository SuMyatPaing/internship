<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            border: 1px solid black;
            border-radius: 10px;
            margin: auto;
            margin-top: 100px;
            /*  change inline into block */
            display: block;
            /* display: grid; 
          grid-template-columns: repeat(4,1fr);  
          (<div><button></button></div>)
          */
            width: 250px;
            height: 350px;
            padding: 10px;
            max-width: 320px;
            box-shadow: 0 2px 5px;
        }


        button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 4px 6px;
            background: rgb(223, 223, 223);
            color: rgb(208, 56, 56);
            border: none;
            font-size: 20px;
        }

        #result {
            width: 100%;
            height: 20px;
            padding: 15px 0px;
            text-align: right;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .btn1 {
            color: rgb(220, 130, 20);
            background-color: rgb(167, 167, 228);
        }

        .btn2 {
            color: skyblue;
            background-color: rgb(167, 167, 228);
        }

        .btn3 {
            color: white;
            background-color: pink;
        }
    </style>
</head>

<body>
    <h1>Phone Calculator</h1>
    <div class="container">
        <div><input type="text" id="result" name="result" value="0"></div>
        <button class="btn1" onclick="clearFun()">C</button>
        <button onclick="deleteFun()" class="btn1"><i class="fa-solid fa-delete-left"></i></button>
        <button onclick="getData('%')" class="btn2">%</button>
        <button onclick="getData('/')" class="btn1">/</button>
        <button onclick="getData(7)" class="btn2">7</button>
        <button onclick="getData(8)" class="btn2">8</button>
        <button onclick="getData(9)" class="btn2">9</button>
        <button onclick="getData('*')" class="btn1">*</button>
        <button onclick="getData(4)" class="btn2">4</button>
        <button onclick="getData(5)" class="btn2">5</button>
        <button onclick="getData(6)" class="btn2">6</button>
        <button onclick="getData('-')" class="btn1">-</button>
        <button onclick="getData(1)" class="btn2">1</button>
        <button onclick="getData(2)" class="btn2">2</button>
        <button onclick="getData(3)" class="btn2">3</button>
        <button onclick="getData('+')" class="btn1">+</button>
        <button onclick="getData('(')" class="btn2">(</button>
        <button onclick="getData(')')" class="btn2">)</button>
        <button onclick="getData(0)" class="btn2">0</button>
        <button onclick="addDot('.')" class="btn2">.</button>
        <button onclick="calculate('=')" class="btn3">=</button>

    </div>
    <script>
        let result = document.getElementById("result");
        let isResult = false;
        function getData(data) {

            let start = result.selectionStart;
            let end = result.selectionEnd;
            let before = result.value.substring(0, start);
            let after = result.value.substring(end);


            let lastChar = result.value.slice(-1); // Get the last character typed
           
            let operators = ["+", "-", "*", "/", "%"];
           

            if (data === '(' && !isNaN(lastChar) && before !== '' && lastChar !== '(' && result.value !== "0") {
                result.value = before + '*(' + after;
                result.setSelectionRange(start + 2, start + 2);
                result.focus();
                return;
            }


            //added bracket  code
            let nextChar = after.charAt(0);

// ) နောက်မှာ number ရိုက်ရင် * ထည့်
if (!isNaN(data) && lastChar === ')') {

    result.value = before + '*' + data + after;

    result.setSelectionRange(start + 2, start + 2);
    result.focus();

    return;
}

// )( ရိုက်ရင် * ထည့်
if (data === '(' && lastChar === ')') {

    result.value = before + '*(' + after;

    result.setSelectionRange(start + 2, start + 2);
    result.focus();

    return;
}

            if (operators.includes(lastChar) && operators.includes(data)) {
                result.value = before.slice(0, -1) + data + after;
                result.setSelectionRange(start, start);
                result.focus();
                return;
            }

            if (result.value === '0' && !operators.includes(data.toString())) {
                result.value = data;
                result.setSelectionRange(1, 1);
            } else {
                result.value = before + data + after;
                result.setSelectionRange(start + 1, start + 1);
            }
            result.focus();
        }//end of get function














        function calculate() {

            // 1. Automatically close missing brackets
            let open = (result.value.match(/\(/g) || []).length;
            let close = (result.value.match(/\)/g) || []).length;
            while (open > close) {
                result.value += ")";
                close++;
            }
            // 2. Handle empty or invalid bracket content
            if (result.value.includes("()")) {
                result.value = "Error";
                return;
            }

            try {

                // 4. Perform calculation
                // let finalResult = eval(result.value);
                let expression = result.value.replace(/%/g, '/100');

                let finalResult = eval(expression);

                // 3. Check for division by zero
                if (result.value.includes('/0') && !result.value.includes('/0.')) {
                    result.value = "Cannot divide by 0";
                    return;
                }
                
                if (Number.isInteger(finalResult)) {
                    result.value = finalResult;
                } else {
                    result.value = parseFloat(finalResult.toFixed(6));
                }

            } catch (error) {
                // This catches cases like (5+) or other syntax issues
                result.value = "Error! ";
            }


        }//end of calculate function

        // isResult = true;
        function addDot() {
            let lastnum = result.value.split(/[\+\-\*\/]/).pop();
            if (!lastnum.includes(".")) {
                result.value += ".";

            }
            result.focus();
        }//end calc function

        function clearFun() {
            result.value = "0";
            result.focus();
        }
        function deleteFun(data) {
            // result.value = result.value.slice(0, -1) || "0";
            let start = result.selectionStart;
            let end = result.selectionEnd;

            if (start !== end) {

                result.value = result.value.substring(0, start) + result.value.substring(end);
                result.setSelectionRange(start, start);
            } else if (start > 0) {

                result.value = result.value.substring(0, start - 1) + result.value.substring(end);
                result.setSelectionRange(start - 1, start - 1);
            }

            if (result.value === "") result.value = "0";
            result.focus();
        }
    </script>
</body>

</html>
