<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">




</head>
<html>
<div class="card " style="width: 45rem;">
  <h2>Update Variables</h2>
  <div class="mb-3 row">
    <label for="name" class="col-sm-2 col-form-label">Name(string):</label>
    <div class="col-sm-10">
      <input type="text" class="form-control" id="name" value="">
    </div>
  </div>
  <div class="mb-3 row">
    <label for="age" class="col-sm-2 col-form-label">Age(Number):</label>
    <div class="col-sm-10">
      <input type="number" class="form-control" id="age">
    </div>
  </div>
  <div class="mb-3 row">
    <label for="vipStatus" class="col-sm-2 col-form-label">VIP Status(Boolean):</label>
    <div class="col-sm-10">
      <input type="checkbox" id="vipStatus">
    </div>
  </div>
  <div class="mb-3 row">
    <label for="cardColor" class="form-label">Card Color:</label>
    <input type="color" class="form-control form-control-color" id="cardColor" value="#563d7c"
      title="Choose your color">
  </div>
</div>



<h2>Live DOM Output</h2>
<br>
<div class="card" style="width: 18rem;">
  <p style="color: yellow;">VIP MEMBER</p>
  <p>Hello Hello</p>
  <p>Age:32</p>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
