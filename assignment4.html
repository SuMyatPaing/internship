<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
        }

        .card {
            width: 450px;
            /* height: 300px; */
            border: 1px solid black;
            border-radius: 15px;
            margin: 200px 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            /* justify-content: center; */
            padding: 20px;
            box-shadow: 0 2px 5px;

        }

        button {
            width: 370px;
            background-color: blue;
            color: white;
            border-radius: 5px;
            padding: 15px;
        }
        button:hover{
            background-color: aqua;
        }

        h5 {
            border: 1px dotted black;
            width: 370px;
            padding: 5px;
            display: flex;
            justify-content: space-between;

        }

        span {
            border-radius: 30px;
            color: green;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Mini Calculator</h1>
        <span>
            <input type="number" name="num1" id="num1">
            <select name="operator" id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
            <input type="number" name="num2" id="num2">
        </span>
        <button onclick="calculate()">Calculate Amount</button>

        <h5>Result:<span id="result"></span></h5>
    </div>
    <script>

        function calculate() {
            //parseFloat/parseInt(for  full number)
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);

            let operator = document.getElementById("operator").value;
            let result = document.getElementById("result");
            let ans;
            if (isNaN(num1) || isNaN(num2)) {
result.innerHTML = "<style='color:red;'>You must fill two inputs!</style=>";
            }else{
                switch (operator) {

                    case "+": ans = num1 + num2; break;
                    case "-": ans = num1 - num2; break;
                    case "*": ans = num1 * num2; break;
                    // case "/": ans = num1 / num2; break;
                    case"/":
                    if( num2===0){
                        ans="Cannot divided by 0";break;
                    }else{
                        ans=num1/num2;break;
                    }
                    default: ans="error occurs";
                }
                result.innerHTML = ans;
                // num1.value="";
                // num2.value="";
            } 
        }  
            
            
        

    </script>
</body>

</html>
